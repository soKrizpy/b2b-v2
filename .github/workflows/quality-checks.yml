name: Quality checks

on:
  workflow_dispatch: {}
  push:
    branches:
      - fix/ai-chatbot-error-handling-20261027
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Audit dependency vulnerabilities (full and production)
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-full.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');
          for (const [label, path] of [
            ['FULL (dependencies + devDependencies)', '/tmp/npm-audit-full.json'],
            ['PRODUCTION (--omit=dev)', '/tmp/npm-audit-production.json'],
          ]) {
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              console.log(`\n=== npm audit: ${label} ===\nCould not parse npm audit JSON output.`);
              continue;
            }
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(`\n=== npm audit: ${label} ===`);
            console.log(JSON.stringify({
              counts: {
                info: counts.info ?? 0,
                low: counts.low ?? 0,
                moderate: counts.moderate ?? 0,
                high: counts.high ?? 0,
                critical: counts.critical ?? 0,
                total: counts.total ?? 0,
              },
              findings: Object.entries(report.vulnerabilities ?? {}).map(([name, item]) => ({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via ?? []).map(v => typeof v === 'string' ? v : v.title).filter(Boolean),
              })),
            }, null, 2));
          }
          NODE

      - name: Block merge readiness when production dependencies are vulnerable
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = '/tmp/npm-audit-production.json';
          let report;
          try {
            report = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch {
            console.error('Production npm audit report is missing or invalid; failing closed.');
            process.exit(1);
          }
          const counts = report.metadata?.vulnerabilities;
          if (!counts || typeof counts.total !== 'number') {
            console.error('Production npm audit did not return vulnerability metadata; failing closed.');
            process.exit(1);
          }
          console.log(JSON.stringify({productionAudit: counts}, null, 2));
          if (counts.total > 0) {
            console.error('Production dependencies contain known vulnerabilities.');
            process.exit(1);
          }
          NODE

      - name: Preview dependency fixes without modifying the lockfile
        shell: bash
        run: |
          npm audit fix --dry-run --json > /tmp/npm-audit-fix-preview.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/npm-audit-fix-preview.json', 'utf8');
          const start = raw.indexOf('{');
          if (start < 0) {
            console.log('No parseable JSON returned by npm audit fix --dry-run.');
            console.log(raw.slice(-5000));
            process.exit(0);
          }
          let report;
          try {
            report = JSON.parse(raw.slice(start));
          } catch {
            console.log('Could not parse dry-run output; tail follows for manual review.');
            console.log(raw.slice(-5000));
            process.exit(0);
          }
          console.log(JSON.stringify({
            note: 'Dry run only; no package.json or package-lock.json changes are committed.',
            added: report.added,
            removed: report.removed,
            changed: report.changed,
            audit: report.audit?.metadata?.vulnerabilities,
            advisories: Object.entries(report.audit?.vulnerabilities ?? {}).map(([name, item]) => ({
              package: name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
            })),
          }, null, 2));
          NODE
