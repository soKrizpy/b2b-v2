name: Quality checks

on:
  push:
    branches:
      - fix/security-priority-audit
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check TypeScript
        run: npx tsc --noEmit
