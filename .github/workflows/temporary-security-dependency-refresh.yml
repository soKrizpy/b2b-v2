name: Temporary security dependency refresh
on:
  push:
    branches:
      - fix/security-priority-audit
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/fix/security-priority-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-priority-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted patched dependency versions
        run: |
          npm pkg set 'overrides.postcss=^8.5.23' 'overrides.source-map-js=^1.2.2'
          npm install next@15.5.28 sharp@0.35.5
      - name: Run tests and typecheck
        run: |
          npm test
          npx tsc --noEmit
      - name: Capture production audit
        run: |
          npm audit --omit=dev --json > /tmp/production-audit.json || true
          node -e "const a=require('/tmp/production-audit.json'); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities, findings:Object.keys(a.vulnerabilities||{})},null,2))"
      - name: Commit only dependency manifests and remove this temporary workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-security-dependency-refresh.yml
          git add package.json package-lock.json
          git commit -m "fix(security): patch production dependency vulnerabilities"
          git push origin HEAD:fix/security-priority-audit
